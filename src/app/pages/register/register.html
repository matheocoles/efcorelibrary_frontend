<div class="container">

    <nz-card [nzTitle]="isEditing ? 'Modifier le compte' : 'Créer un nouveau compte'" class="form-card">
        <form nz-form [formGroup]="accountForm" (ngSubmit)="submitForm()">

            <div style="display: flex; gap: 16px;">
                <nz-form-item style="flex: 1;">
                    <nz-form-label nzRequired>Identifiant</nz-form-label>
                    <nz-form-control nzErrorTip="Requis">
                        <input nz-input formControlName="username" placeholder="jdupont" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item style="flex: 1;">
                    <nz-form-label nzRequired>Nom complet</nz-form-label>
                    <nz-form-control nzErrorTip="Requis">
                        <input nz-input formControlName="fullName" placeholder="Jean Dupont" />
                    </nz-form-control>
                </nz-form-item>
            </div>

            <div style="display: flex; gap: 16px;">
                <nz-form-item style="flex: 1;">
                    <nz-form-label nzRequired>Rôle</nz-form-label>
                    <nz-form-control>
                        <nz-select formControlName="role">
                            @for (r of rolesList; track r.value) {
                                <nz-option [nzValue]="r.value" [nzLabel]="r.label"></nz-option>
                            }
                        </nz-select>
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item style="flex: 1;">
                    <nz-form-label nzRequired>
                        {{ isEditing ? 'Nouveau mot de passe' : 'Mot de passe' }}
                    </nz-form-label>
                    <nz-form-control nzErrorTip="Requis (min 6 caractères)">
                        <input type="password" nz-input formControlName="password" placeholder="******" />
                    </nz-form-control>
                </nz-form-item>
            </div>

            <div style="text-align: right;">
                <button *ngIf="isEditing" nz-button type="button" (click)="resetForm()" style="margin-right: 8px;">
                    Annuler
                </button>

                <button nz-button nzType="primary" [nzLoading]="isLoading">
                    {{ isEditing ? 'Mettre à jour' : 'Créer le compte' }}
                </button>
            </div>

        </form>
    </nz-card>

    <nz-card nzTitle="Liste des utilisateurs">
        <nz-table #basicTable [nzData]="accounts()" [nzLoading]="isLoading" [nzPageSize]="5">
            <thead>
            <tr>
                <th>Identifiant</th>
                <th>Nom Complet</th>
                <th>Rôle</th> <th nzWidth="150px">Actions</th>
            </tr>
            </thead>
            <tbody>
                @for (data of basicTable.data; track data.id) {
                    <tr>
                        <td>{{ data.username }}</td>
                        <td>{{ data.fullName }}</td>
                        <td>
                            <nz-tag [nzColor]="data.role === 'Admin' ? 'red' : 'blue'">
                                {{ data.role || 'User' }}
                            </nz-tag>
                        </td>
                        <td>
                            <button nz-button nzType="text" nz-tooltip="Modifier" (click)="startEdit(data)">
                                <span nz-icon nzType="edit" nzTheme="outline" style="color: #1890ff;"></span>
                            </button>

                            <a nz-popconfirm
                               nzPopconfirmTitle="Voulez-vous vraiment supprimer ce compte ?"
                               nzPopconfirmPlacement="bottom"
                               (nzOnConfirm)="deleteAccount(data.id)">
                                <button nz-button nzType="text" nzDanger nz-tooltip="Supprimer">
                                    <span nz-icon nzType="delete" nzTheme="outline"></span>
                                </button>
                            </a>
                        </td>
                    </tr>
                }
            </tbody>
        </nz-table>
    </nz-card>

</div>
